services:
  media-processor:
    build: ./services/media-processor
    container_name: clinicos-media-processor
    restart: unless-stopped
    env_file: .local/media-processor.env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: [local]
  scanner:
    image: clamav/clamav:1.5.4-debian@sha256:d7ede3cefeaf3b8a72ebcdee849d13f504bbca3f3b3cfade5bc7b6ee06a4f62c
    container_name: clinicos-scanner
    restart: unless-stopped
    volumes:
      - scanner-definitions:/var/lib/clamav
    networks:
      - local
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 20
networks:
  local:
    name: clinicos-local
    external: true
volumes:
  scanner-definitions:
